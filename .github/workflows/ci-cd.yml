
name: CI/CD

on:
  push:
    branches:
      - master
      - "pre-release/v*"
      - "release/v*"

  workflow_dispatch:
    inputs:
      rollback_namespace:
        description: "Namespace to roll back (leave empty to skip)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}-backend
  IMAGE_FRONTEND: ${{ github.repository }}-frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend build validation
        working-directory: backend
        run: node --check src/index.js

      - name: Backend tests
        working-directory: backend
        run: npm test --if-present

      - name: Frontend build
        working-directory: frontend
        run: npm run build

  build-and-push:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      namespace: ${{ steps.meta.outputs.namespace }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag and target namespace
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:7}"
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"

          echo "tag=${SAFE_BRANCH}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          case "${GITHUB_REF_NAME}" in
            master)
              echo "namespace=dev" >> "$GITHUB_OUTPUT"
              ;;
            pre-release/v*)
              echo "namespace=preprod" >> "$GITHUB_OUTPUT"
              ;;
            release/v*)
              echo "namespace=release" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported branch: ${GITHUB_REF_NAME}"
              exit 1
              ;;
          esac

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.namespace }}-latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.meta.outputs.namespace }}-latest

  deploy:
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ needs.build-and-push.outputs.namespace }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_B64"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Deploy manifests
        env:
          NAMESPACE: ${{ needs.build-and-push.outputs.namespace }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/manifests
          cp k8s/*.yaml /tmp/manifests/

          # Update backend and frontend image references.
          sed -i \
            "s#image: .*backend.*#image: ${REGISTRY}/${IMAGE_BACKEND}:${TAG}#" \
            /tmp/manifests/backend-deployment.yaml

          sed -i \
            "s#image: .*frontend.*#image: ${REGISTRY}/${IMAGE_FRONTEND}:${TAG}#" \
            /tmp/manifests/frontend-deployment.yaml

          # Update namespace references.
          sed -i "s/namespace: dev/namespace: ${NAMESPACE}/g" \
            /tmp/manifests/*.yaml

          kubectl create namespace "$NAMESPACE" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -n "$NAMESPACE" -f /tmp/manifests/

          kubectl rollout status -n "$NAMESPACE" \
            deployment/backend --timeout=120s

          kubectl rollout status -n "$NAMESPACE" \
            deployment/frontend --timeout=120s

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.rollback_namespace != ''
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Configure kubectl
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_B64"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Roll back backend and frontend
        env:
          NAMESPACE: ${{ inputs.rollback_namespace }}
        run: |
          set -euo pipefail
          kubectl rollout undo -n "$NAMESPACE" deployment/backend
          kubectl rollout undo -n "$NAMESPACE" deployment/frontend
