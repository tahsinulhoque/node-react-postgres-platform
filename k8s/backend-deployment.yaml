
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: node-react-postgres-platform-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: DB_HOST
              value: postgres-service
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: appuser
            - name: DB_PASSWORD
              value: apppass
            - name: DB_NAME
              value: appdb
            - name: REDIS_URL
              value: redis://redis-service:6379
            - name: SEARCH_URL
              value: http://search-service:9200
