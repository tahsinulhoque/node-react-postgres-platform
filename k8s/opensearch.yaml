apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: plugins.security.disabled
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
          resources:
            requests:
              memory: 768Mi
              cpu: 250m
            limits:
              memory: 1536Mi
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-service
  namespace: dev
spec:
  selector:
    app: opensearch
  ports:
    - port: 9200
      targetPort: 9200
